name: par2cmdline release build

on:
  push:
    branches:
    - 'master'
  workflow_dispatch:

jobs:
  build-check-linux:
    uses: ./.github/workflows/build-check-linux.yml

  build-check-mingw:
    uses: ./.github/workflows/build-check-mingw.yml

  build-check-windows:
    uses: ./.github/workflows/build-check-windows.yml

  build-check-macos:
    uses: ./.github/workflows/build-check-macos.yml

  build-check-freebsd:
    uses: ./.github/workflows/build-check-freebsd.yml

  build-check-valgrind:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-check-valgrind.yml

  build-linux:
    needs:
    - build-check-linux

    name: build-linux (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: amd64
          configure_host:
          xcc:
        - arch: arm64
          configure_host: --host=aarch64-linux-gnu
          xcc: aarch64-linux-gnu-
        - arch: armhf
          configure_host: --host=armv7l-linux-gnueabihf
          xcc: arm-linux-gnueabihf-

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install cross toolchains
      if: matrix.arch != 'amd64'
      run: |
        sudo apt-get update
        case "${{ matrix.arch }}" in
          arm64)
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
            ;;
          armhf)
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
            ;;
        esac

    - name: Build
      env:
        CC: ${{ matrix.xcc }}gcc
        CXX: ${{ matrix.xcc }}g++
        LDFLAGS: -static -s
      run: |
        ./automake.sh
        ./configure ${{ matrix.configure_host }}
        make -j"$(nproc)"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-linux-${{ matrix.arch }}
        path: |
          par2
        retention-days: 5

  build-windows:
    needs:
    - build-check-windows

    name: build-windows (${{ matrix.name }})

    strategy:
      matrix:
        include:
        - platform: x64
          name: x64
        - platform: ARM64
          name: arm64

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      run: msbuild -property:Configuration=Release -property:Platform=${{ matrix.platform }} par2cmdline.sln

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-win-${{ matrix.name }}
        path: |
          ${{ matrix.platform }}/Release/par2.exe
        retention-days: 5

  build-macos:
    needs:
    - build-check-macos

    name: build-macos (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: amd64
          xcxxflags: -arch x86_64 -mmacosx-version-min=10.13
        - arch: arm64
          xcxxflags: -arch arm64 -mmacosx-version-min=11.0

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: prepare
      run: brew install automake

    # NOTE: setting CFLAGS/CXXFLAGS suppresses autoconf's default "-g -O2",
    # so -O2 must be passed explicitly or the build ends up unoptimised.
    - name: Build
      env:
        CFLAGS: -O3 ${{ matrix.xcxxflags }}
        CXXFLAGS: -O3 ${{ matrix.xcxxflags }}
      run: |
        ./automake.sh
        ./configure
        make -j"$(sysctl -n hw.ncpu)"
        strip par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-macos-${{ matrix.arch }}
        path: |
          par2
        retention-days: 5

  build-macos-universal:
    needs:
    - build-macos

    runs-on: macos-latest

    steps:
    - name: Download slices
      uses: actions/download-artifact@v8
      with:
        pattern: par2cmdline-macos-*

    - name: Create universal binary
      run: |
        lipo -create \
          par2cmdline-macos-amd64/par2 \
          par2cmdline-macos-arm64/par2 \
          -output par2
        lipo -info par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-macos-universal
        path: |
          par2
        retention-days: 5

  build-freebsd:
    needs:
    - build-check-freebsd

    name: build-freebsd (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: amd64
          sysroot_path: amd64
          triple: x86_64-unknown-freebsd15
        - arch: arm64
          sysroot_path: arm64/aarch64
          triple: aarch64-unknown-freebsd15

    runs-on: ubuntu-latest

    env:
      FREEBSD_VERSION: "15.0"

    steps:
    - uses: actions/checkout@v7

    - name: Install cross toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld

    - name: Cache FreeBSD sysroot
      id: sysroot-cache
      uses: actions/cache@v6
      with:
        path: sysroot
        key: freebsd-sysroot-${{ matrix.sysroot_path }}-${{ env.FREEBSD_VERSION }}

    - name: Fetch FreeBSD sysroot
      if: steps.sysroot-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p sysroot
        curl -fsSL "https://download.freebsd.org/releases/${{ matrix.sysroot_path }}/${FREEBSD_VERSION}-RELEASE/base.txz" \
          | tar -xJ -C sysroot ./usr/include ./usr/lib ./lib

    - name: Build
      env:
        LDFLAGS: -static -s
      run: |
        SYSROOT="$PWD/sysroot"
        ./automake.sh
        ./configure --host=${{ matrix.triple }} \
          CC="clang --target=${{ matrix.triple }} --sysroot=$SYSROOT -fuse-ld=lld" \
          CXX="clang++ --target=${{ matrix.triple }} --sysroot=$SYSROOT -stdlib=libc++ -fuse-ld=lld"
        make -j"$(nproc)"

    - name: Verify the binary targets FreeBSD
      run: |
        file par2
        file par2 | grep -q "FreeBSD" || { echo "not a FreeBSD binary"; exit 1; }

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-freebsd-${{ matrix.arch }}
        path: |
          par2
        retention-days: 5
