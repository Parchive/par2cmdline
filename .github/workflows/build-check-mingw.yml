name: par2cmdline CI MinGW

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-check-mingw:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install MinGW and Wine
      run: sudo apt-get update && sudo apt-get install -y mingw-w64 wine

    - name: Build
      run: |
        cmake -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAR2_KEEP_ASSERTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-w64-mingw32.cmake
        cmake --build build-cmake

    - name: Run Tests
      env:
        WINEDEBUG: -all
        WINEDLLOVERRIDES: mscoree,mshtml=
      run: |
        wineboot --init
        ctest --test-dir build-cmake --output-on-failure
