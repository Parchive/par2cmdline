name: par2cmdline CI Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-check-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      run: |
        cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release -DPAR2_KEEP_ASSERTS=ON
        cmake --build build-cmake -j"$(nproc)"
        ctest --test-dir build-cmake --output-on-failure

    - name: Build and test from the source archive
      run: |
        version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
        git archive --prefix="par2cmdline-$version/" HEAD | tar -x -C "$RUNNER_TEMP"
        cmake -S "$RUNNER_TEMP/par2cmdline-$version" -B "$RUNNER_TEMP/dist" -DCMAKE_BUILD_TYPE=Release -DPAR2_KEEP_ASSERTS=ON
        cmake --build "$RUNNER_TEMP/dist" -j"$(nproc)"
        ctest --test-dir "$RUNNER_TEMP/dist" --output-on-failure
