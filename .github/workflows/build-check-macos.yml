name: par2cmdline CI MacOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-check-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      run: |
        cmake -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build-cmake
        ctest --test-dir build-cmake --output-on-failure
