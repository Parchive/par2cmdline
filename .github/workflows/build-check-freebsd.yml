name: par2cmdline CI FreeBSD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-check-freebsd:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
    - uses: actions/checkout@v7

    - name: Start FreeBSD VM
      uses: cross-platform-actions/action@v1.5.0
      with:
        operating_system: freebsd
        version: '15.0'
        shell: bash

    - name: Build and test
      run: |
        sudo pkg install -y cmake ninja
        cmake -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build-cmake
        ctest --test-dir build-cmake --output-on-failure
