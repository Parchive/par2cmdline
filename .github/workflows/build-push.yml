name: par2cmdline push build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to a PR supersedes previous runs. Pushes to master all finish.
concurrency:
  group: push-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-check-linux:
    uses: ./.github/workflows/build-check-linux.yml

  build-check-sanitizers:
    uses: ./.github/workflows/build-check-sanitizers.yml

  build-check-mingw:
    uses: ./.github/workflows/build-check-mingw.yml

  build-check-linux-cross:
    uses: ./.github/workflows/build-check-linux-cross.yml

  build-check-windows:
    uses: ./.github/workflows/build-check-windows.yml

  build-check-macos:
    uses: ./.github/workflows/build-check-macos.yml

  build-check-freebsd:
    uses: ./.github/workflows/build-check-freebsd.yml
